<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — QwickStep AI</title>
<link rel="icon" type="image/png" href="brand_assets/qwickstep.ai iconic mark (white).png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #F7F4EF;
    --cream-border: #DDD8CF;
    --ink: #111110;
    --ink-3: #6B6860;
    --gold: #D4A745;
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--cream);
    color: var(--ink);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 2rem;
  }
  .card {
    text-align: center;
    max-width: 32rem;
  }
  .eyebrow {
    font-family: "DM Mono", monospace;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.25rem;
  }
  h1 {
    font-family: "DM Serif Display", Georgia, serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }
  h1 em { font-style: italic; color: var(--gold); }
  p {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--ink-3);
  }
  .tag {
    display: inline-block;
    margin-top: 2rem;
    font-family: "DM Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-3);
    border: 1px solid var(--cream-border);
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Test Page</div>
    <h1>Hello from <em>/test</em></h1>
    <p>Just a random test page. If you're reading this, routing and the local server are both working.</p>
    <span class="tag">qwickstep.ai/test</span>
  </div>
</body>
</html>
